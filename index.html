<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite 15 Anos Yasmim</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ENVELOPE -->

<section id="tela-envelope" class="tela-envelope">


<img 
src="imagens/file_000000002c34720eb653895a2e8ebbc9.png"
class="envelope"
onclick="abrirConvite()"
alt="Envelope">


</section>





<!-- CONVITE -->

<section id="tela-convite" class="tela-convite">


<img 
src="imagens/file_00000000c2f8720e9bc3ba3cec583958.png"
class="convite"
alt="Convite">





<!-- CÍRCULOS INVISÍVEIS DE CLIQUE -->


<div class="areas-clique">


<!-- 1 - LISTA DE PRESENTES -->

<div 
class="circulo-presentes"
onclick="listaPresentes()">
</div>




<!-- 2 - LOCAL -->

<div 
class="circulo-local"
onclick="verLocal()">
</div>





<!-- 3 - CONFIRMAR PRESENÇA -->

<div 
class="circulo-confirmar"
onclick="confirmarPresenca()">
</div>



</div>



</section>




<script src="script.js"></script>


</body>

</html>
