<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite 15 Anos Yasmim</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ENVELOPE -->

    <section id="tela-envelope" class="tela-envelope">

        <div class="luz"></div>

        <img 
        src="imagens/file_000000002c34720eb653895a2e8ebbc9.png"
        alt="Envelope do convite"
        class="envelope"
        onclick="abrirConvite()">

    </section>




    <!-- CONVITE -->

    <section id="tela-convite" class="tela-convite">


        <img 
        src="imagens/file_00000000c2f8720e9bc3ba3cec583958.png"
        alt="Convite de 15 anos"
        class="convite">



        <!-- ÁREAS INVISÍVEIS SOBRE OS BOTÕES DA ARTE -->

        <div class="areas-clique">


            <!-- Confirmar Presença -->

            <div 
            class="area-confirmar"
            onclick="confirmarPresenca()">
            </div>



            <!-- Local -->

            <div 
            class="area-local"
            onclick="verLocal()">
            </div>



            <!-- Lista de Presentes -->

            <div 
            class="area-presentes"
            onclick="listaPresentes()">
            </div>


        </div>


    </section>




<script src="script.js"></script>


</body>

</html>
